name: Build unar

on:
  push:
    branches: [ master ]
    # The name of a release tag is the version in unar.m and lsar.m without its `v` (see the job
    # `version`), for example `1.10.7-ky20261031`.
    # For such a tag, the job `release` also puts both packages and their source code on the release
    # page of the tag.
    tags: [ '*-ky[0-9]+' ]

permissions:
  contents: read

jobs:
  # The version of this build: VERSION_STRING in unar.m and lsar.m, without its `v`, for example
  # `1.10.7-ky20261031`. It is in the names of the files that the other jobs make.
  # This job runs first, so a wrong tag stops the workflow before the builds.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version in unar.m and lsar.m
        id: read
        run: |
          # For example, `#define VERSION_STRING @"v1.10.7-ky20261031"` gives `1.10.7-ky20261031`.
          read_version() { sed -n -E 's/^#define VERSION_STRING @"v([^"]+)"$/\1/p' "$1"; }
          version="$(read_version unar.m)"
          if [ -z "$version" ] || [ "$(read_version lsar.m)" != "$version" ]; then
            echo "::error::unar.m and lsar.m must have the same VERSION_STRING."
            exit 1
          fi
          # For a tag, the tag name must exactly match the version. This rule keeps the tag and the
          # names of the files at the same version.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag '$GITHUB_REF_NAME' is not the version in unar.m ('$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: version
    # Not `macos-latest`: GitHub moves that label to newer versions of macOS and Xcode.
    # A newer Xcode may build `unar` differently, or reject MACOSX_DEPLOYMENT_TARGET below.
    runs-on: macos-26
    defaults:
      run:
        # `shell: bash` adds `-o pipefail`: when a command in a pipe fails, the step fails too.
        shell: bash
        working-directory: XADMaster
    env:
      # The oldest macOS that `unar` and `lsar` run on. Without it, they would run only on the macOS
      # of the runner, or newer.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      # Our lha (https://github.com/kuanyui/lha), only to make the LZH archive for a test below.
      LHA_VERSION: 1.14i-ac20260723-ky20261029
      UNAR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The Xcode project of XADMaster expects UniversalDetector next to it, in `../UniversalDetector`.
      - uses: actions/checkout@v7
        with:
          path: XADMaster

      # UniversalDetector is archived (read-only) since 2022, so this commit is its last one.
      - uses: actions/checkout@v7
        with:
          repository: MacPaw/universal-detector
          ref: 4eb832d999628edcd3d134e46bd35357c8c99a85
          path: UniversalDetector

      # This builds universal binaries: `unar` and `lsar` have the code for Apple silicon (arm64)
      # and the code for Intel (x86_64).
      # - `lsar` links to libstdc++.6.dylib, which the macOS SDK no longer has (since Xcode 10).
      #   So link it to libc++ instead, as Homebrew's formula of unar does. The change is made here
      #   only, so the files of this repository stay the same as upstream.
      # - `xcodebuild -target unar` also builds what `unar` needs: libXADMaster.a and libUniversalDetector.a.
      - name: Compile unar and lsar
        run: |
          sed -i '' 's/libstdc++\.6\.dylib/libc++.1.dylib/g' XADMaster.xcodeproj/project.pbxproj
          for target in unar lsar; do
            xcodebuild -project XADMaster.xcodeproj -target "$target" -configuration Release \
              SYMROOT="$PWD/build" \
              ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
              MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          done
          ./build/Release/unar -version
          ./build/Release/lsar -version

      # There is no Mac to try `unar` and `lsar` on before the release.
      # So this step and the 3 steps after it check them here.
      # The runner has an Apple silicon CPU, so these 4 steps run only the arm64 code.
      # The x86_64 code is inspected, but not run.
      - name: Check the CPUs and the oldest macOS
        run: |
          for program in unar lsar; do
            lipo -info "build/Release/$program"
            lipo "build/Release/$program" -verify_arch arm64 x86_64
            for arch in arm64 x86_64; do
              minos="$(vtool -arch "$arch" -show-build "build/Release/$program" | awk '$1 == "minos" { print $2 }')"
              echo "$program ($arch): minos $minos"
              if [ "$minos" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
                echo "::error::The minimum macOS version of the $arch code of $program is $minos, not $MACOSX_DEPLOYMENT_TARGET."
                exit 1
              fi
            done
          done

      # A library from Homebrew on the runner would be missing on other Macs.
      # So the code for each CPU must link only to libraries of macOS, in /usr/lib/ or /System/Library/.
      - name: Check the libraries that unar and lsar need
        run: |
          for program in unar lsar; do
            for arch in arm64 x86_64; do
              output="$(otool -arch "$arch" -L "build/Release/$program")"
              echo "$output"
              # The lines of libraries start with a tab. The first line names the file.
              others="$(grep -E '^[[:space:]]' <<< "$output" | awk '{ print $1 }' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)"
              if [ -n "$others" ]; then
                echo "::error::The $arch code of $program links to libraries outside macOS: $others"
                exit 1
              fi
            done
          done

      # The same check as the test of Homebrew's formula: list and extract a gzip file.
      - name: Check a gzip file
        working-directory: ${{ runner.temp }}
        run: |
          bin="$GITHUB_WORKSPACE/XADMaster/build/Release"
          mkdir gzip-test
          cd gzip-test
          echo hello > hello.txt
          gzip hello.txt
          listing="$("$bin/lsar" hello.txt.gz)"
          echo "$listing"
          if [ "$listing" != $'hello.txt.gz: Gzip\nhello.txt' ]; then
            echo "::error::lsar does not list hello.txt in hello.txt.gz."
            exit 1
          fi
          "$bin/unar" hello.txt.gz
          if [ "$(cat hello.txt)" != hello ]; then
            echo "::error::unar does not extract hello.txt from hello.txt.gz."
            exit 1
          fi

      # Make an LZH archive with a Shift_JIS file name that has が, with our lha.
      # Then check that `unar -encoding Shift_JIS` extracts the file with this name and its content.
      - name: Check a Shift_JIS file name with が in an LZH archive
        working-directory: ${{ runner.temp }}
        run: |
          bin="$GITHUB_WORKSPACE/XADMaster/build/Release"
          url="https://github.com/kuanyui/lha/releases/download/${LHA_VERSION}/lha-${LHA_VERSION}-macos-universal.zip"
          if ! curl -fsSL -o lha.zip "$url"; then
            echo "::error::Cannot download lha ${LHA_VERSION}. Is it on https://github.com/kuanyui/lha/releases ?"
            exit 1
          fi
          unzip -q lha.zip -d lha
          mkdir lzh-test
          cd lzh-test
          name=$'\xe3\x81\x8c.txt'  # が.txt, with が as one character (U+304C)
          echo hello > "$name"
          ../lha/lha c --archive-kanji-code=sjis --system-kanji-code=utf8 test.lzh "$name"
          "$bin/unar" -no-directory -output-directory out -encoding Shift_JIS test.lzh
          ls -l out
          if [ "$(cat "out/$name")" != hello ]; then
            echo "::error::unar does not extract が.txt from test.lzh."
            exit 1
          fi
          # macOS finds a file by either form of が: one character, or か and a combining ゛. So `cat`
          # above works with both. `ls` prints the name as it is written, so it tells which form unar wrote.
          # unar writes names through `-fileSystemRepresentation`, which gives the second form, as macOS
          # usually does. So both forms are accepted: the name must be が.txt after composing it (NFC).
          written="$(ls out)"
          composed="$(printf '%s' "$written" | python3 -I -c 'import sys, unicodedata; print(unicodedata.normalize("NFC", sys.stdin.read()), end="")')"
          if [ "$composed" != "$name" ]; then
            echo "::error::The name of the extracted file is not が.txt, even after composing it (NFC). Its bytes: $(printf '%s' "$written" | od -An -tx1)"
            exit 1
          elif [ "$written" = "$name" ]; then
            echo "::notice::unar wrote が as one character."
          else
            echo "::notice::unar wrote が as か and a combining ゛ (NFD), as macOS usually does."
          fi

      # The license of XADMaster and UniversalDetector (LGPL-2.1, see LICENSE) wants the programs to
      # come with the license, with notices of the changes, and with the source code that they are
      # built from. So the package has `unar`, `lsar`, LICENSE and FORK_MODIFICATIONS.md. The source
      # code is unar-VERSION-src.tar.xz: the job `build-windows` makes it for both release packages. The LGPL
      # allows it to be a separate file, from the same place as the programs (sections 4 and 6d): the
      # same release.
      - name: Pack unar and lsar
        run: |
          name="unar-$UNAR_VERSION-macos-universal"
          mkdir -p "dist/$name"
          cp build/Release/unar build/Release/lsar LICENSE FORK_MODIFICATIONS.md "dist/$name/"
          (cd "dist/$name" && zip -X "../$name.zip" unar lsar LICENSE FORK_MODIFICATIONS.md)
          zipinfo "dist/$name.zip"
          # Unzip the ZIP, and run the unzipped `unar` and `lsar`.
          # This checks that the ZIP keeps their executable bit.
          unzip -q "dist/$name.zip" -d "$RUNNER_TEMP/unzipped"
          "$RUNNER_TEMP/unzipped/unar" -version
          "$RUNNER_TEMP/unzipped/lsar" -version

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: unar-macos-universal
          path: XADMaster/dist/unar-*-macos-universal.zip
          if-no-files-found: error

  # An experiment: can `unar` and `lsar` be built for Windows with GNUstep, in MSYS2?
  # The programs need the DLLs of GNUstep Base (built here, slim) and some DLLs of MSYS2, which are packed with them.
  build-windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: XADMaster
    env:
      UNAR_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The same 2 repositories as in `build-macos`.
      - uses: actions/checkout@v7
        with:
          path: XADMaster

      - uses: actions/checkout@v7
        with:
          repository: MacPaw/universal-detector
          ref: 4eb832d999628edcd3d134e46bd35357c8c99a85
          path: UniversalDetector

      # CLANG64: clang and libc++, which the GNUstep of MSYS2 (gnustep-make, libobjc2) is built with.
      # `gnustep-make` has `gnustep-config`, `llvm-tools` has `ar`, and `ntldd` lists the DLLs that the
      # programs need, in the last step. GNUstep Base is built below, with libffi and libiconv; `pkgconf`
      # helps its configure to find them. Its configure also requires the library of curl
      # (`mingw-w64-clang-x86_64-curl`, see below), as in the build of MSYS2. `zip` and `unzip` make and
      # check the package, and `xz` compresses its source code.
      # A third-party action, so it is pinned to a commit: the tag `v2.33.0` could be moved to other code later, a commit cannot.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            curl
            zip
            unzip
            xz
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-gnustep-make
            mingw-w64-clang-x86_64-libobjc2
            mingw-w64-clang-x86_64-libffi
            mingw-w64-clang-x86_64-libiconv
            mingw-w64-clang-x86_64-curl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-bzip2
            mingw-w64-clang-x86_64-wavpack
            mingw-w64-clang-x86_64-ntldd

      # The GNUstep Base of MSYS2 brings 18 more DLLs (49 MB) for features that unar does not use: ICU
      # (3 DLLs, 38 MB), TLS (GnuTLS and the 12 DLLs that it needs), XML and XSLT. So GNUstep Base 1.31.1,
      # the version of MSYS2, is built here without them. unar does not need ICU: on Windows,
      # XADStringWindows.m converts Shift_JIS and the other encodings with MultiByteToWideChar() of Windows.
      # Two later fixes of GNUstep are needed with the clang of MSYS2:
      # - bace6f54 (2026-04-08), which MSYS2 applies too: its configure test of constant strings.
      #   It changes only config.constant-string-class.m, so this file is taken from that commit.
      # - #809 (2026-10-05): no `__block` (BLOCK_SCOPE) on an instance variable in
      #   NSBackgroundActivityScheduler.h, which clang rejects in every file that imports Foundation.
      # CC, CXX and OBJCFLAGS are from the build of MSYS2 (mingw-w64-gnustep-base/PKGBUILD).
      # configure requires libcurl with the Objective-C 2.0 runtime (libobjc2), but only NSURLSession uses
      # it, which also needs libdispatch and is disabled here. A DLL imports only the functions that it
      # uses, so the DLL of GNUstep Base does not need the DLL of curl, as in the build of MSYS2.
      # The package has the source code of this DLL (LGPL-2.1-or-later). LGPL-2.1 (section 2a) wants each
      # changed file to say that it was changed, and when. So both changed files get a comment that says so.
      # The source code is copied before configure, which adds its own files.
      - name: Build a slim GNUstep Base 1.31.1
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gnustep-base.tar.gz \
            https://github.com/gnustep/libs-base/releases/download/base-1_31_1/gnustep-base-1.31.1.tar.gz
          echo "e7546f1c978a7c75b676953a360194a61e921cb45a4804497b4f346a460545cd  gnustep-base.tar.gz" | sha256sum -c
          tar -xzf gnustep-base.tar.gz
          cd gnustep-base-1.31.1
          curl -fsSL -o config/config.constant-string-class.m \
            https://raw.githubusercontent.com/gnustep/libs-base/bace6f54fd5fb882cb3adc79c87cc82d5c6d9c70/config/config.constant-string-class.m
          echo "dbd1e3c0ba830b139117a19e94292add21dd76a109301f48049f5ebd52694cfe  config/config.constant-string-class.m" | sha256sum -c
          notice='Changed on 2026-10-29 by https://github.com/kuanyui/XADMaster'
          sed -i "1i /* $notice: this file is from commit bace6f54 of GNUstep Base, not from 1.31.1. */" \
            config/config.constant-string-class.m
          header=Headers/Foundation/NSBackgroundActivityScheduler.h
          sed -i "s|BLOCK_SCOPE GSScheduledBlock _block;|GSScheduledBlock _block;  /* $notice: no BLOCK_SCOPE, as in pull request #809 of GNUstep Base. */|" "$header"
          if grep -q -F 'BLOCK_SCOPE GSScheduledBlock _block;' "$header"; then
            echo "::error::$header still has BLOCK_SCOPE on the instance variable _block."
            exit 1
          fi
          mkdir ../gnustep-base-src
          cp -a "$PWD" ../gnustep-base-src/
          export CC=clang CXX=clang++ OBJCFLAGS=-Wno-incompatible-pointer-types
          ./configure --prefix="$MINGW_PREFIX" --disable-icu --disable-tls --disable-xml --disable-xslt --disable-nsurlsession
          make -j"$(nproc)"
          make install

      # The Makefile.windows files of both repositories are from 2012: they call gcc, expect GNUstep in
      # C:\GNUstep, and XADMaster's links to the old 32-bit zlib and bzip2 in Windows/lib. So these variables
      # are replaced on the command line. The files of both repositories stay the same as upstream.
      # - `-iquote Windows/include`: only for `#import "regex.h"` in XADRegex.h. So its old zlib.h and
      #   bzlib.h, which `#include <...>` would find, are not used.
      # - LIBS: `gnustep-config --base-libs` gives the libraries of GNUstep. zlib, bzip2 and wavpack are for
      #   the archive formats, winmm and gdi32 of Windows are from Makefile.windows. pthread is for
      #   `pthread_once()` in XADStuffItXEnglishHandle.m: on Windows, it is in winpthreads, not in the C library.
      # - UniversalDetector first, and only its library: without it, the make of XADMaster would make
      #   UniversalDetector's test program too.
      # - `-k`, and the second make runs even if the first fails: one run shows as many errors as possible.
      - name: Compile unar and lsar
        run: |
          overrides=(
            OBJCC=clang CC=clang CXX=clang++ LD=clang++
            GNUSTEP_OPTS="$(gnustep-config --objc-flags)"
            GCC_OPTS="-O2 -Wno-import -Wno-multichar -g -D_FILE_OFFSET_BITS=64 -iquote Windows/include"
            ALL_LDFLAGS="-Wl,--whole-archive -fexceptions"
            LIBS="-Wl,--no-whole-archive $(gnustep-config --base-libs) -lz -lbz2 -lwavpack -lpthread -lwinmm -lgdi32"
          )
          failed=
          make -C ../UniversalDetector -f Makefile.windows -k -j"$(nproc)" --output-sync=target "${overrides[@]}" \
            libUniversalDetector.a || failed=1
          make -f Makefile.windows -k -j"$(nproc)" --output-sync=target "${overrides[@]}" \
            unar lsar || failed=1
          if [ -n "$failed" ]; then
            echo "::error::make failed. See the errors above."
            exit 1
          fi
          # clang may name the programs `unar` and `lsar`, without `.exe`.
          for program in unar lsar; do
            if [ ! -f "$program.exe" ]; then mv "$program" "$program.exe"; fi
          done
          ./unar.exe -version
          ./lsar.exe -version

      # The DLLs that unar.exe and lsar.exe load, and the DLLs that those DLLs load, except the DLLs of
      # Windows. For each DLL: its size, the MSYS2 package that has it, and the license of this package.
      # The next step packs them, from the list in dlls.tsv. The table is also an annotation, which can be
      # read without logging in to GitHub.
      # `ntldd -R` reads the DLL names in the files, without running the programs. (`ldd` runs them,
      # and failed here without a message.) It prints Windows paths, which `cygpath` converts.
      - name: List the DLLs that unar.exe and lsar.exe need
        run: |
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          ls -l unar.exe lsar.exe
          if ! output="$(ntldd -R unar.exe lsar.exe)"; then
            echo "::error::ntldd failed."
            exit 1
          fi
          echo "$output"
          dlls="$(awk 'tolower($3) ~ /\\clang64\\bin\\/ { print $3 }' <<< "$output" | cygpath -u -f - | sort -u)"
          # unar.exe needs at least the DLL of GNUstep Base. So an empty list means that the output of
          # ntldd was not understood.
          if [ -z "$dlls" ]; then
            echo "::error::The output of ntldd has no DLL of MSYS2."
            exit 1
          fi
          table=
          total=0
          : > "$tmp/dlls.tsv"
          while IFS= read -r dll; do
            size="$(stat -c %s "$dll")"
            total=$(( total + size ))
            # The DLL of GNUstep Base is built here, so it belongs to no package, and `pacman -Q` fails.
            # `|| true`: with `-o pipefail`, the failure of `pacman` in a pipe would stop the step.
            package="$(pacman -Qoq "$dll" 2> /dev/null || echo '(built here)')"
            version="$(pacman -Q "$package" 2> /dev/null | awk '{ print $2 }' || true)"
            license="$(pacman -Qi "$package" 2> /dev/null | sed -n 's/^Licenses *: //p' || true)"
            printf '%s\t%s\t%s\t%s\n' "$dll" "$package" "$version" "$license" >> "$tmp/dlls.tsv"
            table+="$(printf '%7d KB  %-36s %-44s %s' "$(( size / 1024 ))" "${dll##*/}" "$package" "$license")"$'\n'
          done <<< "$dlls"
          printf '%s' "$table"
          mb="$(awk -v bytes="$total" 'BEGIN { printf "%.1f", bytes / 1048576 }')"
          summary="unar.exe and lsar.exe need $(wc -l <<< "$dlls") DLLs of MSYS2, $mb MB in all."
          # In an annotation, % is written as %25, and a line end as %0A.
          table="${table//'%'/%25}"
          echo "::notice::${summary}%0A${table//$'\n'/%0A}"

      # The source code of XADMaster and UniversalDetector, for unar-VERSION-src.tar.xz (see the next step).
      # MSYS2 has no git: it is not installed there, and MSYS2 does not get the PATH of Windows (`path-type:
      # minimal` of setup-msys2). So this step uses Git Bash, with the git of the runner, which
      # actions/checkout uses too.
      - name: Archive the source code of XADMaster and UniversalDetector
        shell: bash
        run: |
          git archive --prefix="unar-$UNAR_VERSION-src/XADMaster/" -o "$RUNNER_TEMP/XADMaster-src.tar" HEAD
          git -C ../UniversalDetector archive --prefix="unar-$UNAR_VERSION-src/UniversalDetector/" -o "$RUNNER_TEMP/UniversalDetector-src.tar" HEAD

      # The license of XADMaster and UniversalDetector (LGPL-2.1, see LICENSE) and the licenses of the DLLs
      # want the programs to come with the licenses, with notices of the changes, and with the source code
      # of the parts under the LGPL or the GPL. So the package has:
      # - unar.exe, lsar.exe, and the DLLs listed above next to them, where Windows looks for DLLs first.
      # - LICENSE, FORK_MODIFICATIONS.md, and `licenses/`: the license files of each MSYS2 package (from its
      #   share/licenses/) and of GNUstep Base.
      # - THIRD-PARTY.txt: for each DLL, its package, version and license, and for an LGPL or GPL one, where
      #   its source code is in unar-VERSION-src.tar.xz.
      # The source code is not in the package. It is in unar-VERSION-src.tar.xz, for both release packages. The LGPL
      # allows it to be a separate file, from the same place as the programs (sections 4 and 6d): the same
      # release. It has XADMaster and UniversalDetector (with this workflow, which shows how they and
      # GNUstep Base are built), GNUstep Base with its 2 changes, and the MSYS2 source package of each DLL
      # whose license has GPL (LGPL too). A source package has the PKGBUILD, the patches and the upstream
      # source code.
      # For XADMaster and UniversalDetector, `xz -9e` makes a file 38% smaller than ZIP. The MSYS2 source
      # packages are already compressed with zstd.
      # This step fails if a license file, or the source code of an LGPL or GPL part, is missing.
      - name: Pack unar and lsar with their DLLs and licenses, and make the source archive
        run: |
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          name="unar-$UNAR_VERSION-win64"
          source_archive="unar-$UNAR_VERSION-src.tar.xz"
          dist="$PWD/dist/$name"
          src="$tmp/src/${source_archive%.tar.xz}"
          gnustep="$tmp/gnustep-base-src/gnustep-base-1.31.1"
          mkdir -p "$dist/licenses" "$src/msys2"
          cp unar.exe lsar.exe LICENSE FORK_MODIFICATIONS.md "$dist/"
          tar -x -C "$tmp/src" -f "$tmp/XADMaster-src.tar"
          tar -x -C "$tmp/src" -f "$tmp/UniversalDetector-src.tar"
          cp -a "$gnustep" "$src/"
          printf '%-36s %-44s %-14s %-40s %s\n' DLL Package Version License "Source code in $source_archive" > "$dist/THIRD-PARTY.txt"
          while IFS=$'\t' read -r dll package version license; do
            file="${dll##*/}"
            cp "$dll" "$dist/"
            if [ "$package" = '(built here)' ]; then
              # Only the source code of GNUstep Base is in the source archive.
              if [[ "$file" != *gnustep-base* ]]; then
                echo "::error::$file is built here, but it is not the DLL of GNUstep Base, so its source code is missing."
                exit 1
              fi
              package=gnustep-base version=1.31.1 license=LGPL-2.1-or-later source="${gnustep##*/}/"
              mkdir -p "$dist/licenses/gnustep-base"
              cp "$gnustep"/COPYING* "$dist/licenses/gnustep-base/"
            else
              # Keep the folders under share/licenses/, so that 2 files with the same name do not collide.
              licenses="$(pacman -Qlq "$package" | grep '/share/licenses/' | grep -v '/$' || true)"
              if [ -z "$licenses" ]; then
                echo "::error::The package $package of $file has no license file under share/licenses/."
                exit 1
              fi
              while IFS= read -r license_file; do
                relative="${license_file#*/share/licenses/}"
                mkdir -p "$dist/licenses/$(dirname "$relative")"
                cp "$license_file" "$dist/licenses/$relative"
              done <<< "$licenses"
              source=-
              if grep -q -i gpl <<< "$license"; then
                # The name of the source package: %BASE% in the database of pacman, and the version, with `~`
                # instead of the `:` after an epoch, as in the file names of MSYS2.
                base="$(sed -n '/^%BASE%$/ { n; p; q }' "/var/lib/pacman/local/$package-$version/desc" || true)"
                source="msys2/$base-${version/:/\~}.src.tar.zst"
                if [ -z "$base" ] || ! curl -fsSL -o "$src/$source" "https://repo.msys2.org/mingw/sources/${source#msys2/}"; then
                  echo "::error::Cannot download the source package of $package $version (${source#msys2/})."
                  exit 1
                fi
              fi
            fi
            printf '%-36s %-44s %-14s %-40s %s\n' "$file" "$package" "$version" "$license" "$source" >> "$dist/THIRD-PARTY.txt"
          done < "$tmp/dlls.tsv"
          cat "$dist/THIRD-PARTY.txt"
          # A smaller package: remove the debug information and the symbols of the files built here, as
          # makepkg does for the packages of MSYS2 (`--strip-all` for programs, `--strip-unneeded` for DLLs).
          # The DLLs of MSYS2 are already stripped.
          ls -l "$dist"/*.exe "$dist"/*gnustep-base*.dll
          llvm-strip --strip-all "$dist/unar.exe" "$dist/lsar.exe"
          llvm-strip --strip-unneeded "$dist"/*gnustep-base*.dll
          ls -l "$dist"/*.exe "$dist"/*gnustep-base*.dll
          (cd "$dist" && zip -r -X -q "../$name.zip" .)
          zipinfo "dist/$name.zip"
          tar -c -C "$tmp/src" "${src##*/}" | xz -9e > "dist/$source_archive"
          tar -t -J -f "dist/$source_archive" | awk -F / 'NF > 2 { print $1 "/" $2 }' | sort -u
          echo "::notice::$name.zip: $(( $(stat -c %s "dist/$name.zip") / 1024 )) KB. $source_archive: $(( $(stat -c %s "dist/$source_archive") / 1024 )) KB."

      # Then the checks below run the programs of the package, as on a Windows without MSYS2:
      # - Unzip the package. This also checks the ZIP.
      # - Hide CLANG64 of MSYS2: its DLLs, and the files that GNUstep Base may look for at their paths in
      #   MSYS2. A DLL or a file missing from the package then makes a check fail.
      # The commands of the checks (bash, gzip, od...) are in /usr/bin of MSYS2, not in CLANG64.
      - name: Unzip the package, and hide CLANG64 of MSYS2
        run: |
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          unzip -q "dist/unar-$UNAR_VERSION-win64.zip" -d "$tmp/unar-win64"
          mv "$MINGW_PREFIX" "$MINGW_PREFIX-hidden"
          "$tmp/unar-win64/unar.exe" -version
          "$tmp/unar-win64/lsar.exe" -version

      # The same check as in `build-macos`, with the programs of the package.
      # On Windows, lsar.exe may print a line end as `\r\n`, so `tr` removes the `\r`.
      - name: Check a gzip file
        working-directory: ${{ runner.temp }}
        run: |
          bin="$(cygpath -u "$RUNNER_TEMP")/unar-win64"
          mkdir gzip-test
          cd gzip-test
          echo hello > hello.txt
          gzip hello.txt
          listing="$("$bin/lsar.exe" hello.txt.gz | tr -d '\r')"
          echo "$listing"
          if [ "$listing" != $'hello.txt.gz: Gzip\nhello.txt' ]; then
            echo "::error::lsar does not list hello.txt in hello.txt.gz."
            exit 1
          fi
          "$bin/unar.exe" hello.txt.gz
          if [ "$(cat hello.txt)" != hello ]; then
            echo "::error::unar does not extract hello.txt from hello.txt.gz."
            exit 1
          fi

      # LZH archives with a file name that has が, in the encodings of Japanese LZH archives: Shift_JIS
      # (most of them), EUC-JP and UTF-8 (rare). The Shift_JIS one is the same check as in `build-macos`.
      # lha.exe cannot make them here: it gets the file names of its command line in the ANSI code page of
      # Windows (CP1252 on the runner), which has no が. So the bytes of each archive are written here,
      # with a level-0 header (see `get_header_level0()` in src/header.c of LHa for UNIX). The 3 archives
      # differ only in the file name, and so in the header size and the sum of the header bytes.
      # They were checked with lhasa (`lha t`) and lsar (`lsar -e ENCODING`).
      # All 3 are checked even if one fails.
      - name: Check が.txt in LZH archives, in Shift_JIS, EUC-JP and UTF-8
        working-directory: ${{ runner.temp }}
        run: |
          bin="$(cygpath -u "$RUNNER_TEMP")/unar-win64"
          name=$'\xe3\x81\x8c.txt'  # が.txt, with が as one character (U+304C)
          mkdir lzh-test
          cd lzh-test
          failed=
          #   encoding   header size, sum   file name: length, bytes (が is 82 AA in Shift_JIS, A4 AC in EUC-JP)
          for test in 'Shift_JIS  \x1c\x55  \x06\x82\xaa\x2e\x74\x78\x74' \
                      'EUC-JP     \x1c\x79  \x06\xa4\xac\x2e\x74\x78\x74' \
                      'UTF-8      \x1d\x1a  \x07\xe3\x81\x8c\x2e\x74\x78\x74'; do
            read -r encoding size_and_sum file_name <<< "$test"
            archive="$size_and_sum"
            archive+='\x2d\x6c\x68\x30\x2d'      # method `-lh0-`: stored, not compressed
            archive+='\x06\x00\x00\x00'          # compressed size: 6
            archive+='\x06\x00\x00\x00'          # original size: 6
            archive+='\x00\x00\x21\x5c'          # MS-DOS time and date: 2026-01-01 00:00
            archive+='\x20\x00'                  # attribute "archive", header level 0
            archive+="$file_name"
            archive+='\x34\x5a'                  # CRC-16 of the content
            archive+='\x68\x65\x6c\x6c\x6f\x0a'  # content: "hello" and a line end
            archive+='\x00'                      # end of the archive
            printf '%b' "$archive" > "$encoding.lzh"
            if ! "$bin/unar.exe" -no-directory -output-directory "out-$encoding" -encoding "$encoding" "$encoding.lzh"; then
              echo "::error::unar fails on $encoding.lzh."
              failed=1
              continue
            fi
            written="$(ls "out-$encoding" || true)"
            echo "$encoding: $written"
            # Windows keeps a file name as it is given, so the name must be exactly が.txt, with が as one character.
            if [ "$written" != "$name" ] || [ "$(cat "out-$encoding/$name")" != hello ]; then
              echo "::error::unar does not extract $encoding.lzh as が.txt with its content. The bytes of the name: $(printf '%s' "$written" | od -An -tx1)"
              failed=1
            fi
          done
          if [ -n "$failed" ]; then
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: unar-win64
          path: XADMaster/dist/unar-*-win64.zip
          if-no-files-found: error

      # The source code of both packages.
      - name: Upload the source code
        uses: actions/upload-artifact@v7
        with:
          name: unar-src
          path: XADMaster/dist/unar-*-src.tar.xz
          if-no-files-found: error

  # Only for a release tag: create the release page of the tag, with the packages and the source code
  # that `build-macos` and `build-windows` made.
  # This job never replaces a published file: if the release page already exists, this job fails
  # instead.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release page and to upload files to it.
      contents: write
    steps:
      # The 3 artifacts: `unar-macos-universal`, `unar-win64` and `unar-src`.
      # Their files go into the same folder.
      - name: Download the packages and the source code
        uses: actions/download-artifact@v8
        with:
          pattern: unar-*
          path: dist
          merge-multiple: true

      # `gh` (GitHub CLI) is already on the runner, so no third-party action runs with write permission.
      # It creates the release as a draft, uploads the files, and then publishes it.
      # `--verify-tag`: without it, a missing tag would be created from the default branch.
      - name: Create the release page with the packages and the source code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/unar-*-macos-universal.zip \
            dist/unar-*-win64.zip \
            dist/unar-*-src.tar.xz \
            --verify-tag --title "$GITHUB_REF_NAME"
